kind = "web"
previewPath = "/"
title = "Vite React TypeScript"
description = "A blank Vite-powered React and TypeScript starter project for building a new web application."
version = "1.0.0"
id = "artifacts/vite-react-typescript"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21243

[services.development]
run = "pnpm --filter @workspace/vite-react-typescript run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vite-react-typescript", "run", "build" ]
serve = "static"
publicDir = "artifacts/vite-react-typescript/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21243"
BASE_PATH = "/"
